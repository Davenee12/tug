# Spike 1 for v0.5.7 calling: a throwaway probe, NOT part of the tug app build.
# The empty [workspace] table keeps cargo from ever attaching this crate to another workspace,
# and nothing in src-tauri or package.json references this directory.
[package]
name = "tug-call-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Probe: can an unpackaged Win32 exe with sparse-package identity dial through a paired iPhone?"

[workspace]

[[bin]]
name = "tug-call-spike"
path = "src/main.rs"

[build-dependencies]
embed-manifest = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel",
  "ApplicationModel_Calls",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
