[package]
name = "tug"
version = "0.5.6"
description = "Bluetooth LE companion that mirrors iPhone notifications and media controls to Windows"
authors = ["tug contributors"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "tug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
log = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Devices_Geolocation",
  "Devices_Radios",
  "Networking",
  "Networking_Sockets",
  "Storage_Streams",
  "Web_Http",
] }
windows-collections = "0.3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
