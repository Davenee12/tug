[package]
name = "tug"
version = "0.5.21"
description = "Bluetooth LE companion that mirrors iPhone notifications and media controls to Windows"
authors = ["tug contributors"]
license = "MIT"
edition = "2021"
# An app, never a crates.io package (and its path dependencies couldn't be published anyway).
publish = false

# `tug` itself is the workspace root. The two small crates are the local bridge that companion
# processes use to talk to the running app (`tug-bridge`) and the `tug` command plus MCP server
# (`tug-cli`, shipped as `bin\tug.exe`; see docs/DEVELOPERS.md).
default-run = "tug"

[workspace]
members = ["crates/tug-bridge", "crates/tug-cli"]

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "tug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
log = "0.4"
thiserror = "2"
# Tugboat (phone <-> PC over the local Wi-Fi): a small HTTP server while Tugboat is open, the
# phone page's chunks sealed with XChaCha20-Poly1305 under keys derived from the QR's secret.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Tugboat's own accept loop: header timeouts and a connection cap, which axum::serve lacks.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
chacha20poly1305 = "0.10"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
qrcode = { version = "0.14", default-features = false }
# Tugboat's shared clipboard: a picture on the clipboard goes to the phone as a PNG. Already in the
# tree through Tauri's icon handling, so this adds no new crate.
png = "0.18"
tauri-plugin-dialog = "2"
# Developer tools (v0.5.12): the local bridge the `tug` command and MCP server talk to.
tug-bridge = { path = "crates/tug-bridge" }
# Verification codes for the bridge: a port of src/lib/codes.ts, whose look-arounds the
# `regex` crate can't express.
fancy-regex = "0.19"
# Automatic updates (updater/), checked with Tauri's own free minisign signature. Windows' TLS
# (schannel) instead of rustls: no `ring`, and no .zip/.tar support, which NSIS updates don't need.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls"] }
# Version comparison for updates (never a downgrade); already in the tree through Tauri.
semver = "1"
# Voice typing's speech model download (voice/model.rs): the HTTP client tauri-plugin-updater
# already brings in, with Windows' TLS (schannel), so this adds no new crate.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Bring in your full message history (v0.5.18): reading a local iPhone backup. Its Info.plist and
# Manifest.plist (`plist`, already in the tree through Tauri), and, for an encrypted backup, the
# keybag's PBKDF2-SHA256 + PBKDF2-SHA1 derivation, the AES key unwrap of the class and file keys
# and the AES-256-CBC file decryption. Pure-Rust RustCrypto crates on the same digest/cipher
# generation as the ones above; `zeroize` (already in the tree) wipes keys and the password.
plist = "1"
aes = "0.9"
aes-kw = { version = "0.3", default-features = false }
cbc = "0.2"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Data_Xml_Dom",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Devices_Geolocation",
  "Devices_Radios",
  "Media",
  "Media_Audio",
  "Media_Playback",
  "Networking",
  "Networking_Sockets",
  "Security_Cryptography",
  "Storage_Streams",
  "UI_Notifications",
  "Web_Http",
  # Album art and app icons: image downloads with automatic redirects off (HttpBaseProtocolFilter),
  # so a cover only ever comes from the Apple image server tug checked.
  "Web_Http_Filters",
  "Web_Http_Headers",
  "Win32_Foundation",
  # Hide previews while sharing or presenting: whether the display is duplicated (QueryDisplayConfig)
  # and whether the foreground window really covers its monitor (MonitorFromWindow).
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  # Full message history: JPEG previews of an iPhone's photos (HEIC with HEIF Image Extensions).
  "Win32_Graphics_Imaging",
  # The PC's region (GetUserDefaultGeoName): whether a bare 10-digit number is a +1 number.
  "Win32_Globalization",
  # Code fill: clearing an auto-copied code (only if it's still on the clipboard), the
  # type-the-code shortcut (RegisterHotKey) and its Unicode keystrokes (SendInput).
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security_Credentials",
  # Wake detection: the suspend/resume notification and the sleep-inclusive vs awake-only clocks.
  "Win32_System_Power",
  # Settings › Developer tools › Add tug to PATH (the user's own PATH, HKCU only).
  "Win32_System_Registry",
  # Tugboat's help: whether this account is an administrator (the firewall prompt may need one).
  "Win32_Security",
  "Win32_System_Threading",
  # Full message history: reading the phone's zoneless text times in this PC's time zone
  # (TzSpecificLocalTimeToSystemTime), so Bluetooth texts are compared with a backup's in UTC.
  "Win32_System_Time",
  "Win32_System_WindowsProgramming",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  # Quick actions: the taskbar jump list (ICustomDestinationList, IShellLinkW tasks with a title)
  # and the AppUserModelID the window and the list share.
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  # Voice typing: the microphone (wave-in), Windows' offline speech recognizer (SAPI 5, a COM API),
  # and its small on-screen listening indicator (GDI).
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Speech",
  "Win32_System_Com",
  # Voice typing's accurate engine: free memory before loading it (GlobalMemoryStatusEx), and the
  # process's working set in its by-hand measurement test.
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
] }
windows-collections = "0.3"
# Voice typing's accurate engine: whisper.cpp, compiled from source (CMake + MSVC) and linked
# statically, run on the CPU with a speech model downloaded once on request. Its Rust bindings are
# generated with bindgen at build time (which needs libclang); its build settings (a fixed AVX2
# instruction set, the static C/C++ runtime) are in .cargo/config.toml.
whisper-rs = "0.16"
# Same version Tauri already pulls in (see Cargo.lock), so the WebView2 controller handed back by
# `with_webview` is the same type: lets us hook ProcessFailed to log web-content crashes.
webview2-com = "0.39"

[dev-dependencies]
# The Tugboat integration test plays the phone over a real socket.
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
