[package]
name = "tug"
version = "0.5.11"
description = "Bluetooth LE companion that mirrors iPhone notifications and media controls to Windows"
authors = ["tug contributors"]
edition = "2021"

# `tug` itself is the workspace root. The two small crates are the local bridge that companion
# processes use to talk to the running app (`tug-bridge`) and the `tug` command plus MCP server
# (`tug-cli`, shipped as `bin\tug.exe`; see docs/DEVELOPERS.md).
default-run = "tug"

[workspace]
members = ["crates/tug-bridge", "crates/tug-cli"]

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "tug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
log = "0.4"
thiserror = "2"
# Tugboat (phone <-> PC over the local Wi-Fi): a small HTTP server while Tugboat is open, the
# phone page's chunks sealed with XChaCha20-Poly1305 under keys derived from the QR's secret.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Tugboat's own accept loop: header timeouts and a connection cap, which axum::serve lacks.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
tauri-plugin-dialog = "2"
# Developer tools (v0.5.12): the local bridge the `tug` command and MCP server talk to.
tug-bridge = { path = "crates/tug-bridge" }
# Verification codes for the bridge: a port of src/lib/codes.ts, whose look-arounds the
# `regex` crate can't express.
fancy-regex = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Data_Xml_Dom",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Devices_Geolocation",
  "Devices_Radios",
  "Media",
  "Media_Audio",
  "Media_Playback",
  "Networking",
  "Networking_Sockets",
  "Security_Cryptography",
  "Storage_Streams",
  "UI_Notifications",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security_Credentials",
  # Wake detection: the suspend/resume notification and the sleep-inclusive vs awake-only clocks.
  "Win32_System_Power",
  # Settings › Developer tools › Add tug to PATH (the user's own PATH, HKCU only).
  "Win32_System_Registry",
  "Win32_System_WindowsProgramming",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-collections = "0.3"
# Same version Tauri already pulls in (see Cargo.lock), so the WebView2 controller handed back by
# `with_webview` is the same type: lets us hook ProcessFailed to log web-content crashes.
webview2-com = "0.39"

[dev-dependencies]
# The Tugboat integration test plays the phone over a real socket.
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
