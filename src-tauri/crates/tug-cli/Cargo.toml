[package]
name = "tug-cli"
version = "0.5.12"
description = "The tug command and MCP server: talks to the running tug app over its local bridge"
authors = ["tug contributors"]
license = "MIT"
edition = "2021"
publish = false

# Built as `tug-cli.exe`, shipped inside tug's install folder as `bin\tug.exe` (see
# tauri.conf.json `bundle.resources` and scripts/build-cli.mjs).
[[bin]]
name = "tug-cli"
path = "src/main.rs"

[dependencies]
tug-bridge = { path = "../tug-bridge" }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `tug boat <name>`: Windows Search's index (Windows.Storage.Search) and the real known folders
# (which may be redirected to OneDrive) to find the file a bare name means.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Search",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
