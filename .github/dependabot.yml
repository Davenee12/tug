# Weekly version updates. Security updates (Dependabot alerts) are separate and arrive as soon as
# an advisory is published; these keep the lockfiles from drifting so those fixes stay small.
# Minor and patch bumps are grouped into one PR per ecosystem; majors come one at a time so each
# can be read and tested on its own. Every PR still has to pass `check`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
