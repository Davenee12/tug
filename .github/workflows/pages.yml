# Publishes tug's website (site/, plain HTML and CSS) to GitHub Pages at
# https://davenee12.github.io/tug/ whenever a change to it lands on main.
# Needs Pages turned on once by the owner: Settings › Pages › Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default; only the deploy job gets what publishing to Pages needs.
permissions:
  contents: read

# One deploy at a time, and never cancel one that's under way (a half-finished Pages deploy
# can leave the site out of step).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to a commit SHA (tag in the comment), like release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The site is static: what's in site/ is exactly what's published, no build step.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
