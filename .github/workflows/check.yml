# The same checks `npm run check` runs locally, on every PR and on main, on Windows
# (tug is Windows-only: WinRT Bluetooth, NSIS installer).
name: check

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the job only checks out and builds.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Third-party actions are pinned to a commit SHA (tag in the comment). Pinned by SHA,
      # rust-toolchain can't read the toolchain from the ref, so it's named explicitly.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Tauri embeds the built frontend at compile time, so clippy/tests need dist/.
      - run: npm run build

      - run: npm run check
